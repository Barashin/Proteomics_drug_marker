title: "プロテオミクスによるバイオマーカー発見 〜DIA-MSデータ解析で大腸がんマーカーを探る〜"
summary: |-
  📰 概要
  DIA-MSプロテオミクスデータを用いて、大腸がんのバイオマーカー候補タンパク質を発見するまでの解析を、初心者向けに丁寧に解説した技術書です。

  Toyota et al. (Proteomes 2025) の論文をフォローし、DIA-MSデータからタンパク質を同定・定量し、がん関連データベースCOSMICとの照合、差分発現解析、クラスタリング、PCAまでの一連のパイプラインを再現します。

  環境構築からコードの実行、結果の解釈まで、すべてPC上で完結するインシリコ解析です。

  👫 対象とする読者
  ・プロテオミクスに興味があるがデータ解析は未経験の方
  ・DIA-MSデータの解析方法を学びたい方
  ・バイオマーカー探索の流れを手を動かしながら理解したい方
  ・PCだけでプロテオミクス論文の再現をしたい方

  📰アップデート情報
  2026/03/17: リリースしました！

