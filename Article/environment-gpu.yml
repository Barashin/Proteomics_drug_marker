name: crc-proteomics-gpu
channels:
  - conda-forge
  - bioconda
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13
  - statsmodels>=0.14
  - requests>=2.31
  - openpyxl>=3.1
  # GPU support - CUDA 12.0 compatible (WSL2 safe)
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.8
  # Proteomics tools
  - openms=3.1.0
  - pip
  - pip:
    - peptdeep>=1.4.0
    - pyprophet>=2.2.0
    - gseapy>=1.0