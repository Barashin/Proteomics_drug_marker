title: "DIA-MSプロテオミクスで大腸がんバイオマーカーを探る ― Toyota et al. 2025 完全再現"
summary: |-
  DIA-MS（データ非依存型取得）プロテオミクスを用いた大腸がんバイオマーカー探索論文
  (Toyota et al., Proteomes 2025) のdry解析パイプラインを、無料ツールのみで完全再現します。

  対象読者:
  ・バイオインフォマティクス初心者（プログラミング未経験OK）
  ・プロテオミクスデータ解析に興味がある研究者・学生
  ・DIA-MSの論文を自分で再現してみたい方
  ・論文のdry解析パートを学びたいウェット研究者

topics:
