title: "DIA-MSプロテオミクスで大腸がんバイオマーカーを探る - 論文再現から深層学習応用まで"
summary: |-
  Toyota et al. 2025の論文を題材に、DIA-MSプロテオミクス解析を段階的に学ぶ実践書。
  無料ツールのみで2,110タンパク質の検出から、深層学習による19,981タンパク質の大幅改善まで完全再現。

  対象読者：
  ・バイオインフォマティクス初学者
  ・プロテオミクス解析に興味のある研究者
  ・商用利用可能なオープンソースワークフローを求める企業エンジニア

  【本書で学べること】
  ・ProteomeXchangeからのデータ取得
  ・sage-proteomics（MIT）による高速DIA解析
  ・Python/pandas/scipy/matplotlib による統計解析・可視化
  ・OpenMS + AlphaPeptDeepによる深層学習DIA解析（19,981タンパク質）
  ・COSMICデータベースを使ったがん関連タンパク質の同定
  ・ステージ別解析とクラスタリング
  ・Sage vs OpenMSの性能・実用性比較

  【特徴】
  ・全コードコピペ実行可能
  ・対応Jupyter Notebook完備
  ・商用利用制限なし（MIT/BSD/Apache）
  ・論文の1.9倍の検出性能を深層学習で達成
topics: ["proteomics", "bioinformatics", "python", "labcode", "machine-learning"]
